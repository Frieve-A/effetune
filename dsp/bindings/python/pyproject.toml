[build-system]
requires = [
  "nanobind>=2.9,<4",
  "scikit-build-core>=1.0,<2"
]
build-backend = "scikit_build_core.build"

[project]
name = "effetune"
version = "0.18.1"
description = "Deterministic, host-neutral audio DSP for Python"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "soundfile>=0.12"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14"
]

[project.scripts]
effetune = "effetune.cli:main"

[project.urls]
Homepage = "https://effetune.frieve.com/dsp/"
Documentation = "https://effetune.frieve.com/dsp/"
Repository = "https://github.com/Frieve-A/effetune"
Issues = "https://github.com/Frieve-A/effetune/issues"

[tool.scikit-build]
build-dir = "../../../out/phase1-python/build/{wheel_tag}"
wheel.packages = ["src/effetune"]
# Official releases are wheel-only. Building this subproject as an sdist would
# omit the DSP sources that intentionally remain rooted in the monorepo.

[tool.cibuildwheel.windows]
repair-wheel-command = 'python "{project}/tools/repair-dsp-windows-wheel.py" "{wheel}" "{dest_dir}"'

[tool.cibuildwheel.macos]
environment = { MACOSX_DEPLOYMENT_TARGET = "15.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
