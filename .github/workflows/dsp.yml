name: DSP Core

on:
  workflow_call:
    inputs:
      stage:
        description: Platform stage to verify
        required: true
        type: string
      package_smoke:
        description: Run the Windows Electron package smoke test
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  linux:
    if: inputs.stage == 'linux'
    name: Linux DSP verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Setup Emscripten SDK
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.2
      - name: Build committed DSP artifacts
        run: npm run build:dsp
      - name: Verify committed generated files and artifacts
        shell: bash
        run: git diff --exit-code && test -z "$(git status --porcelain)"
      - name: Run Debug native tests and allocation guard
        run: |
          npm run test:dsp -- --native-build-type=Debug
          node tools/dsp-parity/run.mjs --native --allocations
      - name: Run Release native tests and parity
        run: |
          npm run test:dsp -- --native-build-type=Release
          node tools/dsp-parity/run.mjs --native
      - name: Run WebAssembly parity
        run: npm run test:dsp:parity

  windows:
    if: inputs.stage == 'windows'
    name: Windows DSP verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run Debug native tests and allocation guard
        run: |
          npm run test:dsp -- --native-build-type=Debug
          node tools/dsp-parity/run.mjs --native --allocations
      - name: Run Release native tests and parity
        run: |
          npm run test:dsp -- --native-build-type=Release
          node tools/dsp-parity/run.mjs --native
      - name: Package Electron application
        if: inputs.package_smoke
        run: npm run pack
      - name: Verify packaged DSP artifacts
        if: inputs.package_smoke
        run: npm run smoke:dsp-package
