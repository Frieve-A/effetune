name: DSP Library

on:
  workflow_call:
    inputs:
      stage:
        description: DSP Library CI stage to run
        required: true
        type: string
      verify_docs:
        description: Run the DSP documentation site stage in the Linux job
        required: false
        default: true
        type: boolean
      verify_dsp:
        description: Verify committed DSP artifacts and golden parity in the Linux job
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  preflight:
    name: Static preflight
    if: ${{ inputs.stage == 'preflight' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify manifests, identity, paths, and workflow syntax
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          required = [
              "dsp/bindings/acceptance/python_golden_runner.py",
              "tools/verify-dsp-library-goldens.mjs",
              "js/audio/dsp-engine-binding.js",
              "js/audio/dsp-wasm-loader.js",
              "js/audio/dsp-params.generated.js",
              "js/ir-library/ir-asset-payload.js",
              "js/ir-library/ir-plugin-contract.js",
              "plugins/dsp/effetune-dsp.wasm",
              "plugins/dsp/effetune-dsp.simd.wasm",
              "plugins/dsp/effetune-dsp.meta.json",
          ]
          missing = [item for item in required if not Path(item).is_file()]
          if missing:
              raise SystemExit(f"missing DSP library inputs: {missing}")
          python_data = tomllib.loads(
              Path("dsp/bindings/python/pyproject.toml").read_text("utf-8")
          )
          npm_data = json.loads(
              Path("dsp/bindings/js/package.json").read_text("utf-8")
          )
          if python_data["project"]["name"] != "effetune":
              raise SystemExit("unexpected Python package name")
          if npm_data["name"] != "@effetune/dsp":
              raise SystemExit("unexpected npm package name")
          expected_urls = {
              "Homepage": "https://effetune.frieve.com/dsp/",
              "Documentation": "https://effetune.frieve.com/dsp/",
              "Repository": "https://github.com/Frieve-A/effetune",
              "Issues": "https://github.com/Frieve-A/effetune/issues",
          }
          if python_data["project"].get("urls") != expected_urls:
              raise SystemExit("unexpected Python project URLs")
          if (
              npm_data.get("homepage") != expected_urls["Homepage"]
              or npm_data.get("repository", {}).get("url")
              != expected_urls["Repository"]
              or npm_data.get("bugs", {}).get("url") != expected_urls["Issues"]
          ):
              raise SystemExit("unexpected npm project URLs")
          if python_data["project"]["version"] != npm_data["version"]:
              raise SystemExit("Python/npm versions do not match")
          expected_files = [
              "dist/",
              "LICENSE",
              "README.md",
              "THIRD_PARTY_NOTICES.txt",
          ]
          if npm_data.get("files") != expected_files:
              raise SystemExit("npm package allowlist changed")
          PY
          ruby -e "require 'yaml'; ARGV.each { |path| YAML.parse_file(path) }" \
            .github/workflows/ci.yml \
            .github/workflows/dsp-library-ci.yml \
            .github/workflows/dsp-library-release.yml
      - run: node scripts/gen-dsp-library-bindings.mjs --check
      - run: node examples/dsp-library/verify-site-inputs.mjs
      - run: node examples/dsp-library/generate-docs.mjs --check
      - name: Install Python runtime dependency for import smoke
        run: python -m pip install "numpy>=1.26"
      - run: node --test tests/esm/dsp-library-codegen.test.mjs tests/esm/dsp-library-codegen-import-smoke.test.mjs tests/esm/dsp-library-docs.test.mjs tests/esm/dsp-library-demo.test.mjs

  linux:
    name: Linux validation and wheels
    if: ${{ inputs.stage == 'linux' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Setup Emscripten SDK
        if: ${{ inputs.verify_dsp }}
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.2
      - name: Verify committed DSP artifacts
        if: ${{ inputs.verify_dsp }}
        run: npm run build:dsp -- --check
      - name: Verify DSP golden parity
        if: ${{ inputs.verify_dsp }}
        run: npm run test:dsp:parity
      - name: Build and test npm package
        working-directory: dsp/bindings/js
        run: |
          npm install --ignore-scripts --package-lock=false
          npm test
          npm run pack:check
      - name: Verify reproducible self-contained demo
        run: node examples/dsp-library/build.mjs --check
      - name: Pack npm release candidate
        working-directory: dsp/bindings/js
        run: |
          mkdir -p "$RUNNER_TEMP/npm-package"
          npm pack --pack-destination "$RUNNER_TEMP/npm-package"
      - name: Clean-install and render a preset
        env:
          PACKAGE_DIRECTORY: ${{ runner.temp }}/npm-package
        run: |
          package_file="$(find "$PACKAGE_DIRECTORY" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$package_file"
          mkdir "$RUNNER_TEMP/npm-smoke"
          cd "$RUNNER_TEMP/npm-smoke"
          npm init --yes
          npm install "$package_file"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createChain } from '@effetune/dsp';

          const preset = {
            version: 1,
            chain: [{
              id: 'smoke-compressor',
              type: 'Compressor',
              enabled: true,
              channel: 'stereo',
              parameters: { threshold: -30, ratio: 8 }
            }]
          };
          const input = [
            Float32Array.from({ length: 512 }, (_, index) => Math.sin(index * 0.1) * 0.8),
            Float32Array.from({ length: 512 }, (_, index) => Math.cos(index * 0.1) * 0.8)
          ];
          const chain = await createChain(preset);
          const output = await chain.process(input, { sampleRate: 48000, seed: 42 });
          assert.equal(output.length, 2);
          assert.equal(output[0].length, 512);
          assert.notDeepEqual([...output[0]], [...input[0]]);
          chain.close();
          NODE
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-package/*.tgz
          if-no-files-found: error
      - name: Build DSP library web package
        run: npm --prefix dsp/bindings/js run build
      - name: Setup Pages
        if: ${{ inputs.verify_docs }}
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Build with Jekyll
        if: ${{ inputs.verify_docs }}
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site
      - name: Make Jekyll output writable
        if: ${{ inputs.verify_docs }}
        run: sudo chown -R "$(id -u):$(id -g)" ./_site
      - name: Snapshot and verify DSP subtree
        if: ${{ inputs.verify_docs }}
        run: |
          node examples/dsp-library/build-site.mjs --guide ./_site/dsp/index.html --check
          node examples/dsp-library/build-site.mjs --guide ./_site/dsp/index.html --output ./_site/dsp
          node examples/dsp-library/verify-site-stage.mjs --stage ./_site/dsp
      - name: Build CPython 3.12 stable-ABI wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          CIBW_BUILD: cp312-*
          CIBW_ARCHS: auto64
          CIBW_SKIP: "*-musllinux_*"
          CIBW_CONFIG_SETTINGS: >-
            cmake.define.ET_PYTHON_STABLE_ABI=ON
            wheel.py-api=cp312
          CIBW_TEST_REQUIRES: numpy>=1.26 soundfile>=0.12
          CIBW_TEST_COMMAND: >-
            python -m unittest discover
            -s {project}/dsp/bindings/python/tests -v &&
            python {project}/dsp/bindings/python/tools/audit_native_exports.py &&
            python {project}/dsp/bindings/acceptance/python_golden_runner.py
            --repo-root {project}
        with:
          package-dir: dsp/bindings/python
          output-dir: wheelhouse/cp312
      - name: Verify CPython 3.12 wheel ABI tag
        env:
          EXPECTED_TAG: cp312-abi3
          WHEEL_DIRECTORY: wheelhouse/cp312
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          wheels = list(Path(os.environ["WHEEL_DIRECTORY"]).glob("*.whl"))
          assert wheels, "cibuildwheel did not produce a wheel"
          expected = os.environ["EXPECTED_TAG"]
          assert all(expected in wheel.name for wheel in wheels), (
              expected,
              [wheel.name for wheel in wheels],
          )
          PY
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify abi3 wheel on newer CPython
        run: python dsp/bindings/python/tools/verify_abi3_wheel.py wheelhouse/cp312
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-ubuntu-latest-cp312
          path: wheelhouse/cp312/*.whl
          if-no-files-found: error
      - name: Build CPython 3.10 wheel
        uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
        env:
          CIBW_BUILD: cp310-*
          CIBW_ARCHS: auto64
          CIBW_SKIP: "*-musllinux_*"
          CIBW_TEST_REQUIRES: numpy>=1.26 soundfile>=0.12
