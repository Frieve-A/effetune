name: CodeQL

on:
  workflow_call:
    inputs:
      language:
        description: CodeQL language to analyze
        required: true
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze ${{ inputs.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          languages: ${{ inputs.language }}
          build-mode: ${{ inputs.language == 'c-cpp' && 'manual' || 'none' }}

      - name: Build C and C++ code
        if: inputs.language == 'c-cpp'
        run: |
          cmake -S dsp -B dsp/build/codeql -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          cmake --build dsp/build/codeql --parallel

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        with:
          category: "/language:${{ inputs.language }}"
