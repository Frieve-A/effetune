name: Deploy Site to GitHub Pages

on:
  workflow_call:
    inputs:
      stage:
        description: Build or deploy stage
        required: true
        type: string
      verify_dsp:
        description: Verify committed DSP artifacts and parity during the build
        required: false
        default: true
        type: boolean

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    if: inputs.stage == 'build'
    name: Build Pages artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Verify DSP site inputs
        run: node examples/dsp-library/verify-site-inputs.mjs

      - name: Verify generated DSP documentation
        run: node examples/dsp-library/generate-docs.mjs --check

      - name: Verify DSP library generated contract
        run: node scripts/gen-dsp-library-bindings.mjs --check

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run mandatory power browser smoke
        timeout-minutes: 2
        run: npm run test:power-browser

      - name: Setup Emscripten SDK
        if: inputs.verify_dsp
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.2

      - name: Verify committed DSP artifacts
        if: inputs.verify_dsp
        run: npm run build:dsp -- --check

      - name: Verify DSP parity
        if: inputs.verify_dsp
        run: npm run test:dsp:parity

      - name: Build DSP library web package
        run: npm --prefix dsp/bindings/js run build

      - name: Verify reproducible DSP demo
        run: node examples/dsp-library/build.mjs --check

      - name: Generate web assets
        run: npm run assets:web

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@44a6e6beabd48582f863aeeb6cb2151cc1716697 # v1
        with:
          source: ./
          destination: ./_site

      - name: Make Jekyll output writable
        run: sudo chown -R "$(id -u):$(id -g)" ./_site

      - name: Stage DSP guide and live demo under existing site
        run: |
          node examples/dsp-library/build-site.mjs --guide ./_site/dsp/index.html --check
          node examples/dsp-library/build-site.mjs --guide ./_site/dsp/index.html --output ./_site/dsp

      - name: Verify staged DSP documentation
        run: node examples/dsp-library/verify-site-stage.mjs --stage ./_site/dsp

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ./_site

  deploy:
    if: inputs.stage == 'deploy'
    name: Deploy Pages artifact
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
