name: Deploy Site to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Verify DSP site inputs
        run: node examples/dsp-library/verify-site-inputs.mjs

      - name: Verify generated DSP documentation
        run: node examples/dsp-library/generate-docs.mjs --check

      - name: Verify DSP library generated contract
        run: node scripts/gen-dsp-library-bindings.mjs --check

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify source and tests
        run: npm run verify

      - name: Run mandatory power browser smoke
        timeout-minutes: 2
        run: npm run test:power-browser

      - name: Setup Emscripten SDK
        uses: emscripten-core/setup-emsdk@v16
        with:
          version: 6.0.2

      - name: Verify committed DSP artifacts
        run: npm run build:dsp -- --check

      - name: Verify DSP parity
        run: npm run test:dsp:parity

      - name: Build DSP library web package
        run: npm --prefix dsp/bindings/js run build

      - name: Verify reproducible DSP demo
        run: node examples/dsp-library/build.mjs --check

      - name: Generate web assets
        run: npm run assets:web

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Make Jekyll output writable
        run: sudo chown -R "$(id -u):$(id -g)" ./_site

      - name: Stage DSP guide and live demo under existing site
        run: |
          node examples/dsp-library/build-site.mjs --guide ./_site/dsp/index.html --check
          node examples/dsp-library/build-site.mjs --guide ./_site/dsp/index.html --output ./_site/dsp

      - name: Verify staged DSP documentation
        run: node examples/dsp-library/verify-site-stage.mjs --stage ./_site/dsp

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
