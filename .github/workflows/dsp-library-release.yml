          subject-path: wheelhouse/cp311/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-macos-15-intel-cp311
          path: wheelhouse/cp311/*.whl
          if-no-files-found: error

  acceptance:
    name: Candidate wrapper acceptance
    needs: macos-intel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-ubuntu-latest-cp312
          path: candidate/python
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: candidate/npm
      - name: Install candidate wheel and browser harness
        run: |
          wheel="$(find candidate/python -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python -m pip install "$wheel"
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Stage the candidate npm tarball for acceptance
        run: |
          package_file="$(find candidate/npm -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$package_file"
          mkdir -p "$RUNNER_TEMP/npm-docs-candidate"
          cd "$RUNNER_TEMP/npm-docs-candidate"
          npm init --yes
          npm install --ignore-scripts --no-audit --no-fund "$GITHUB_WORKSPACE/$package_file"
          cd "$GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/npm-candidate"
          tar -xzf "$package_file" -C "$RUNNER_TEMP/npm-candidate"
          candidate="$RUNNER_TEMP/npm-candidate/package/dist"
          test -f "$candidate/index.js"
          rm -rf dsp/bindings/js/src
          cp -R "$candidate" dsp/bindings/js/src
          cp "$candidate/internal/dsp-engine-binding.js" js/audio/dsp-engine-binding.js
          cp "$candidate/internal/dsp-wasm-loader.js" js/audio/dsp-wasm-loader.js
          cp "$candidate/internal/dsp-params.generated.js" js/audio/dsp-params.generated.js
          cp "$candidate/internal/ir-asset-payload.js" js/ir-library/ir-asset-payload.js
          cp "$candidate/internal/ir-plugin-contract.js" js/ir-library/ir-plugin-contract.js
          cp "$candidate/assets/effetune-dsp.wasm" plugins/dsp/effetune-dsp.wasm
          cp "$candidate/assets/effetune-dsp.simd.wasm" plugins/dsp/effetune-dsp.simd.wasm
          cp "$candidate/assets/effetune-dsp.meta.json" plugins/dsp/effetune-dsp.meta.json
          cp "$candidate/catalog/effects-v1.json" dsp/bindings/generated/effects-v1.json
      - name: Run published documentation against clean candidates
        run: |
          wheel="$(find candidate/python -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          node examples/dsp-library/verify-docs-acceptance.mjs \
            --python python \
            --npm-root "$RUNNER_TEMP/npm-docs-candidate" \
            --wheel "$wheel"
      - name: Verify frozen wrapper matrix
        run: >-
          node tools/verify-dsp-library-goldens.mjs
          --python python
          --summary .tmp/dsp-library-goldens-release.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: dsp-library-acceptance-summary
          path: .tmp/dsp-library-goldens-release.json
          if-no-files-found: warn

  publication-candidate:
    name: Assemble signed publication candidate
    needs: acceptance
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: python-*
          path: release/python
          merge-multiple: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: release/npm
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: release
          format: spdx-json
          output-file: release/SBOM.spdx.json
          upload-artifact: false
      - name: Assemble and verify the public release layout
        working-directory: release
        run: |
          mkdir public-assets
          cp python/*.whl npm/*.tgz SBOM.spdx.json public-assets/
          cd public-assets
          sha256sum *.whl *.tgz SBOM.spdx.json > SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/public-assets/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ github.ref_name }}-publication-candidate
          path: release
          if-no-files-found: error

  publish-npm:
    name: Publish npm with trusted publishing
    needs: publication-candidate
    if: github.repository == 'Frieve-A/effetune' && startsWith(github.ref, 'refs/tags/dsp-v')
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@effetune/dsp
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ github.ref_name }}-publication-candidate
          path: release
      - run: npm publish release/npm/*.tgz --access public

  publish-pypi:
    name: Publish PyPI with trusted publishing
    needs: publish-npm
    if: github.repository == 'Frieve-A/effetune' && startsWith(github.ref, 'refs/tags/dsp-v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/effetune/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ github.ref_name }}-publication-candidate
          path: release
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release/python

  github-release:
    name: Publish signed GitHub release assets
    needs: publish-pypi
    if: github.repository == 'Frieve-A/effetune' && startsWith(github.ref, 'refs/tags/dsp-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ github.ref_name }}-publication-candidate
          path: release
      - name: Create immutable release from the existing tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --generate-notes \
            --title "EffeTune DSP ${GITHUB_REF_NAME#dsp-v}" \
            release/public-assets/*
