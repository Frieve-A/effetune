name: DSP Library Release

on:
  push:
    tags:
      - 'dsp-v*'
  workflow_dispatch:

concurrency:
  group: dsp-library-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  preflight:
    name: Release preflight
    if: github.repository == 'Frieve-A/effetune' && startsWith(github.ref, 'refs/tags/dsp-v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Verify release tag, manifests, identity, paths, and workflow syntax
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import tomllib
          from pathlib import Path

          python_data = tomllib.loads(
              Path("dsp/bindings/python/pyproject.toml").read_text("utf-8")
          )
          npm_data = json.loads(
              Path("dsp/bindings/js/package.json").read_text("utf-8")
          )
          required = [
              "dsp/bindings/acceptance/python_golden_runner.py",
              "tools/verify-dsp-library-goldens.mjs",
              "js/audio/dsp-engine-binding.js",
              "js/audio/dsp-wasm-loader.js",
              "js/audio/dsp-params.generated.js",
              "js/ir-library/ir-asset-payload.js",
              "js/ir-library/ir-plugin-contract.js",
              "plugins/dsp/effetune-dsp.wasm",
              "plugins/dsp/effetune-dsp.simd.wasm",
              "plugins/dsp/effetune-dsp.meta.json",
          ]
          missing = [item for item in required if not Path(item).is_file()]
          if missing:
              raise SystemExit(f"missing DSP library inputs: {missing}")
          python_version = python_data["project"]["version"]
          npm_version = npm_data["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if python_data["project"]["name"] != "effetune":
              raise SystemExit("unexpected Python package name")
          if npm_data["name"] != "@effetune/dsp":
              raise SystemExit("unexpected npm package name")
          expected_urls = {
              "Homepage": "https://effetune.frieve.com/dsp/",
              "Documentation": "https://effetune.frieve.com/dsp/",
              "Repository": "https://github.com/Frieve-A/effetune",
              "Issues": "https://github.com/Frieve-A/effetune/issues",
          }
          if python_data["project"].get("urls") != expected_urls:
              raise SystemExit("unexpected Python project URLs")
          if (
              npm_data.get("homepage") != expected_urls["Homepage"]
              or npm_data.get("repository", {}).get("url")
              != expected_urls["Repository"]
              or npm_data.get("bugs", {}).get("url") != expected_urls["Issues"]
          ):
              raise SystemExit("unexpected npm project URLs")
          expected_files = [
              "dist/",
              "LICENSE",
              "README.md",
              "THIRD_PARTY_NOTICES.txt",
          ]
          if npm_data.get("files") != expected_files:
              raise SystemExit("npm package allowlist changed")
          if not re.fullmatch(r"dsp-v[0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit(f"invalid DSP release tag: {tag}")
          if python_version != npm_version:
              raise SystemExit(
                  f"Python/npm version mismatch: {python_version} != {npm_version}"
              )
          if tag != f"dsp-v{python_version}":
              raise SystemExit(
                  f"release tag/version mismatch: {tag} != dsp-v{python_version}"
              )
          PY
          ruby -e "require 'yaml'; ARGV.each { |path| YAML.parse_file(path) }" \
            .github/workflows/dsp-library-ci.yml \
            .github/workflows/dsp-library-release.yml
      - name: Check C++ formatting
        run: >-
          find dsp -path dsp/vendor -prune -o
          \( -name '*.cpp' -o -name '*.h' \) -print0 |
          xargs -0 clang-format --dry-run --Werror
      - name: Verify generated contract
        run: |
          node scripts/gen-dsp-library-bindings.mjs --check
      - run: node examples/dsp-library/verify-site-inputs.mjs
      - run: node examples/dsp-library/generate-docs.mjs --check
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run common verification
        run: npm run verify

  linux:
    name: Linux release candidates
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Setup Emscripten SDK
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.2
      - name: Verify committed DSP artifacts
        run: npm run build:dsp -- --check
      - name: Run WebAssembly parity
        run: npm run test:dsp:parity
      - name: Run Debug native tests and allocation guard
        run: |
          npm run test:dsp -- --native-build-type=Debug
          node tools/dsp-parity/run.mjs --native --allocations
      - name: Run Release native tests and parity
        run: |
          npm run test:dsp -- --native-build-type=Release
          node tools/dsp-parity/run.mjs --native
      - name: Test and pack npm candidate
        working-directory: dsp/bindings/js
        run: |
          npm install --ignore-scripts --package-lock=false
          npm test
          npm run pack:check
          mkdir -p "$RUNNER_TEMP/npm-dist"
          npm pack --pack-destination "$RUNNER_TEMP/npm-dist"
      - name: Clean-install and render from the npm candidate
        env:
          PACKAGE_DIRECTORY: ${{ runner.temp }}/npm-dist
        run: |
          package_file="$(find "$PACKAGE_DIRECTORY" -maxdepth 1 -name '*.tgz' -print -quit)"
          test -n "$package_file"
          mkdir "$RUNNER_TEMP/npm-smoke"
          cd "$RUNNER_TEMP/npm-smoke"
          npm init --yes
          npm install "$package_file"
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createChain } from '@effetune/dsp';

          const preset = {
            version: 1,
            chain: [{
              id: 'smoke-compressor',
              type: 'Compressor',
              enabled: true,
              channel: 'stereo',
              parameters: { threshold: -30, ratio: 8 }
            }]
          };
          const input = [
            Float32Array.from({ length: 512 }, (_, index) => Math.sin(index * 0.1) * 0.8),
            Float32Array.from({ length: 512 }, (_, index) => Math.cos(index * 0.1) * 0.8)
          ];
          const chain = await createChain(preset);
          const output = await chain.process(input, { sampleRate: 48000, seed: 42 });
          assert.equal(output.length, 2);
          assert.equal(output[0].length, 512);
          assert.notDeepEqual([...output[0]], [...input[0]]);
          chain.close();
          NODE
      - name: Verify reproducible demo
        run: node examples/dsp-library/build.mjs --check
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: ${{ runner.temp }}/npm-dist/*.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package
          path: ${{ runner.temp }}/npm-dist/*.tgz
          if-no-files-found: error
      - name: Build CPython 3.12 stable-ABI wheel
        uses: pypa/cibuildwheel@4726cd35bb13f7bde50cf2761f2499ac7b3aa32c # v4.1.1
        env:
          CIBW_BUILD: cp312-*
          CIBW_ARCHS: auto64
          CIBW_SKIP: "*-musllinux_*"
          CIBW_CONFIG_SETTINGS: >-
            cmake.define.ET_PYTHON_STABLE_ABI=ON
            wheel.py-api=cp312
          CIBW_TEST_REQUIRES: numpy>=1.26 soundfile>=0.12
          CIBW_TEST_COMMAND: >-
            python -m unittest discover
            -s {project}/dsp/bindings/python/tests -v &&
            python {project}/dsp/bindings/python/tools/audit_native_exports.py &&
            python {project}/dsp/bindings/acceptance/python_golden_runner.py
            --repo-root {project}
        with:
          package-dir: dsp/bindings/python
          output-dir: wheelhouse/cp312
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify CPython 3.12 stable-ABI wheel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          wheels = list(Path("wheelhouse/cp312").glob("*.whl"))
          assert wheels, "cibuildwheel did not produce a wheel"
          assert all("cp312-abi3" in wheel.name for wheel in wheels)
          PY
          python dsp/bindings/python/tools/verify_abi3_wheel.py wheelhouse/cp312
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: wheelhouse/cp312/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-ubuntu-latest-cp312
          path: wheelhouse/cp312/*.whl
          if-no-files-found: error
      - name: Build CPython 3.10 wheel
        uses: pypa/cibuildwheel@4726cd35bb13f7bde50cf2761f2499ac7b3aa32c # v4.1.1
        env:
          CIBW_BUILD: cp310-*
          CIBW_ARCHS: auto64
          CIBW_SKIP: "*-musllinux_*"
          CIBW_TEST_REQUIRES: numpy>=1.26 soundfile>=0.12
          CIBW_TEST_COMMAND: >-
            python -m unittest discover
            -s {project}/dsp/bindings/python/tests -v &&
            python {project}/dsp/bindings/python/tools/audit_native_exports.py &&
            python {project}/dsp/bindings/acceptance/python_golden_runner.py
            --repo-root {project}
        with:
          package-dir: dsp/bindings/python
          output-dir: wheelhouse/cp310
      - name: Verify CPython 3.10 wheel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          wheels = list(Path("wheelhouse/cp310").glob("*.whl"))
          assert wheels, "cibuildwheel did not produce a wheel"
          assert all("cp310-cp310" in wheel.name for wheel in wheels)
          PY
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: wheelhouse/cp310/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-ubuntu-latest-cp310
          path: wheelhouse/cp310/*.whl
