      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build CPython 3.12 stable-ABI wheel
        uses: pypa/cibuildwheel@4726cd35bb13f7bde50cf2761f2499ac7b3aa32c # v4.1.1
        env:
          CIBW_BUILD: cp312-*
          CIBW_ARCHS: auto64
          CIBW_SKIP: "*-musllinux_*"
          CIBW_CONFIG_SETTINGS: >-
            cmake.define.ET_PYTHON_STABLE_ABI=ON
            wheel.py-api=cp312
          CIBW_TEST_REQUIRES: numpy>=1.26 soundfile>=0.12
          CIBW_TEST_COMMAND: >-
            python -m unittest discover
            -s {project}/dsp/bindings/python/tests -v &&
            python {project}/dsp/bindings/python/tools/audit_native_exports.py &&
            python {project}/dsp/bindings/acceptance/python_golden_runner.py
            --repo-root {project}
        with:
          package-dir: dsp/bindings/python
          output-dir: wheelhouse/cp312
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Verify CPython 3.12 stable-ABI wheel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          wheels = list(Path("wheelhouse/cp312").glob("*.whl"))
          assert wheels, "cibuildwheel did not produce a wheel"
          assert all("cp312-abi3" in wheel.name for wheel in wheels)
          PY
          python dsp/bindings/python/tools/verify_abi3_wheel.py wheelhouse/cp312
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: wheelhouse/cp312/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-macos-15-intel-cp312
          path: wheelhouse/cp312/*.whl
          if-no-files-found: error
      - name: Build CPython 3.10 wheel
