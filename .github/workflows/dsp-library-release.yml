          CIBW_BUILD: cp310-*
          CIBW_ARCHS: auto64
          CIBW_SKIP: "*-musllinux_*"
          CIBW_TEST_REQUIRES: numpy>=1.26 soundfile>=0.12
          CIBW_TEST_COMMAND: >-
            python -m unittest discover
            -s {project}/dsp/bindings/python/tests -v &&
            python {project}/dsp/bindings/python/tools/audit_native_exports.py &&
            python {project}/dsp/bindings/acceptance/python_golden_runner.py
            --repo-root {project}
        with:
          package-dir: dsp/bindings/python
          output-dir: wheelhouse/cp310
      - name: Verify CPython 3.10 wheel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          wheels = list(Path("wheelhouse/cp310").glob("*.whl"))
          assert wheels, "cibuildwheel did not produce a wheel"
          assert all("cp310-cp310" in wheel.name for wheel in wheels)
          PY
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: wheelhouse/cp310/*.whl
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-macos-15-intel-cp310
          path: wheelhouse/cp310/*.whl
          if-no-files-found: error
      - name: Build CPython 3.11 wheel
        uses: pypa/cibuildwheel@4726cd35bb13f7bde50cf2761f2499ac7b3aa32c # v4.1.1
        env:
          CIBW_BUILD: cp311-*
          CIBW_ARCHS: auto64
          CIBW_SKIP: "*-musllinux_*"
          CIBW_TEST_REQUIRES: numpy>=1.26 soundfile>=0.12
          CIBW_TEST_COMMAND: >-
            python -m unittest discover
            -s {project}/dsp/bindings/python/tests -v &&
            python {project}/dsp/bindings/python/tools/audit_native_exports.py &&
            python {project}/dsp/bindings/acceptance/python_golden_runner.py
            --repo-root {project}
        with:
          package-dir: dsp/bindings/python
          output-dir: wheelhouse/cp311
      - name: Verify CPython 3.11 wheel
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          wheels = list(Path("wheelhouse/cp311").glob("*.whl"))
          assert wheels, "cibuildwheel did not produce a wheel"
          assert all("cp311-cp311" in wheel.name for wheel in wheels)
          PY
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
