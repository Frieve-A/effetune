name: Desktop Release Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  preflight:
    name: Desktop release preflight
    if: github.repository == 'Frieve-A/effetune' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Verify repository and exact desktop version tag
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REPOSITORY" = "Frieve-A/effetune"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "$expected"
          case "$GITHUB_REF_NAME" in
            dsp-v*) echo "DSP tags are handled by dsp-library-release.yml." >&2; exit 1 ;;
          esac
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify dependency registry signatures
        run: npm audit signatures
      - name: Verify source and tests
        run: npm run verify

  linux:
    name: Linux release package
    needs: preflight
    uses: ./.github/workflows/build.yml
    with:
      stage: linux
      third_party_source_bundle: true
      source_verified: true
      release_artifacts: true
    secrets:
      APPIMAGE_GPG_PRIVATE_KEY: ${{ secrets.APPIMAGE_GPG_PRIVATE_KEY }}
      APPIMAGE_GPG_PASSPHRASE: ${{ secrets.APPIMAGE_GPG_PASSPHRASE }}
      APPIMAGE_GPG_KEY_FINGERPRINT: ${{ secrets.APPIMAGE_GPG_KEY_FINGERPRINT }}
    permissions:
      contents: read

  windows:
    name: Windows release package
    needs: preflight
    uses: ./.github/workflows/build.yml
    with:
      stage: windows
      third_party_source_bundle: true
      source_verified: true
      release_artifacts: true
      store_msix: ${{ vars.MSSTORE_BUILD_ENABLED == 'true' }}
    secrets:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
    permissions:
      contents: read

  macos:
    name: macOS release packages
    needs: preflight
    uses: ./.github/workflows/build.yml
    with:
      stage: macos
      third_party_source_bundle: true
      source_verified: true
      release_artifacts: true
    secrets:
      EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
      EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
    permissions:
      contents: read

  sources:
    name: Unified third-party source archive
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Download all platform source artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-sources-*
          path: out/desktop-sources
          merge-multiple: true
      - name: Verify and package corresponding sources
        shell: bash
        run: |
          set -euo pipefail
          node scripts/collect-desktop-sources.mjs --verify out/desktop-sources
          version="$(node -p "require('./package.json').version")"
          mkdir -p dist
          cd out/desktop-sources
          zip -9 -r "$GITHUB_WORKSPACE/dist/EffeTune-${version}-ThirdParty-Source.zip" .
      - name: Upload unified source release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-source-release-artifacts
          path: dist/*-ThirdParty-Source.zip
          if-no-files-found: error
          compression-level: 0
