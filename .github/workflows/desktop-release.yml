name: Desktop Release Packages

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  preflight:
    name: Desktop release preflight
    if: github.repository == 'Frieve-A/effetune' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Verify repository and exact desktop version tag
        shell: bash
        run: |
          set -euo pipefail
          expected="v$(node -p "require('./package.json').version")"
          test "$GITHUB_REPOSITORY" = "Frieve-A/effetune"
          test "$GITHUB_REF_TYPE" = "tag"
          test "$GITHUB_REF_NAME" = "$expected"
          case "$GITHUB_REF_NAME" in
            dsp-v*) echo "DSP tags are handled by dsp-library-release.yml." >&2; exit 1 ;;
          esac
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify dependency registry signatures
        run: npm audit signatures
      - name: Verify source and tests
        run: npm run verify

  linux:
    name: Linux release package
    needs: preflight
    uses: ./.github/workflows/build.yml
    with:
      stage: linux
      openhome_source_bundle: true
      source_verified: true
      release_artifacts: true
    permissions:
      contents: read

  windows:
    name: Windows release package
    needs: preflight
    uses: ./.github/workflows/build.yml
    with:
      stage: windows
      source_verified: true
      release_artifacts: true
    permissions:
      contents: read

  macos:
    name: macOS release packages
    needs: preflight
    uses: ./.github/workflows/build.yml
    with:
      stage: macos
      source_verified: true
      release_artifacts: true
    permissions:
      contents: read
