name: MCP server

# Tests effetune-mcp against the app's real remote host whenever either side changes,
# and publishes it to npm from an `mcp-v*` tag. The server reads effects and their
# parameters from the running app, so an app release needs no MCP release.

on:
  push:
    branches:
      - '**'
    tags:
      - 'mcp-v*'
    paths:
      - 'mcp/**'
      - 'electron/remote-control-host.cjs'
      - 'js/remote/**'
      - '.github/workflows/mcp.yml'
  pull_request:
    paths:
      - 'mcp/**'
      - 'electron/remote-control-host.cjs'
      - 'js/remote/**'
      - '.github/workflows/mcp.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      # The test loads electron/remote-control-host.cjs, which needs the app's `ws`.
      - name: Install app dependencies
        run: npm ci --ignore-scripts
      - name: Install MCP dependencies
        working-directory: mcp
        run: npm ci
      - name: Test
        working-directory: mcp
        run: npm test

  publish:
    name: Publish to npm with trusted publishing
    needs: test
    if: github.repository == 'Frieve-A/effetune' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/mcp-v')
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/effetune-mcp
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Check the tag matches mcp/package.json
        working-directory: mcp
        run: test "mcp-v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      # No install: npm publish packs the files and needs no dependencies, so no
      # dependency install script runs in this job, which can mint an OIDC token.
      - name: Publish
        working-directory: mcp
        run: npm publish --provenance --access public
