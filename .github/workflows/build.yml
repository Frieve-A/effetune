name: Build Electron App

on:
  workflow_call:
    inputs:
      stage:
        description: Platform stage to build
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-linux:
    if: inputs.stage == 'linux'
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate web assets
        run: npm run assets:web

      - name: Build
        run: |
          npm run clean
          npx electron-builder --publish never
        env:
          USE_HARD_LINKS: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged DSP artifacts
        run: npm run smoke:dsp-package

      - name: Package Linux AppImage
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          appimage="EffeTune-${version}.AppImage"
          release_zip="EffeTune-${version}-Linux-AppImage.zip"

          # Keep the executable mode inside the release ZIP because the outer
          # Actions artifact ZIP does not preserve Unix file permissions.
          chmod 0755 "dist/${appimage}"
          (
            cd dist
            zip -9 "${release_zip}" "${appimage}"
            stored_mode="$(zipinfo -l "${release_zip}" "${appimage}" | awk -v file="${appimage}" '$NF == file { print $1 }')"
            test "${stored_mode}" = "-rwxr-xr-x"
          )

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: linux-artifacts
          path: dist/*-Linux-AppImage.zip
          if-no-files-found: error
          compression-level: 0

  build-windows:
    if: inputs.stage == 'windows'
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify source and tests
        run: npm run verify

      - name: Generate web assets
        run: npm run assets:web

      - name: Build
        run: |
          npm run clean
          npx electron-builder --publish never
        env:
          USE_HARD_LINKS: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged DSP artifacts
        run: npm run smoke:dsp-package

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-artifacts
          path: dist/**/*.exe
          if-no-files-found: error

  build-macos:
    if: inputs.stage == 'macos'
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify source and tests
        run: npm run verify

      - name: Generate web assets
        run: npm run assets:web

      - name: Build
        run: |
          npm run clean
          npx electron-builder --publish never
        env:
          USE_HARD_LINKS: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged DSP artifacts
        run: npm run smoke:dsp-package

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-artifacts
          path: dist/**/*.dmg
          if-no-files-found: error
