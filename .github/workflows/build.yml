name: Build Electron App

on:
  push:
    branches: [ main, master, feature/* ]

# Default permissions are read-only
permissions: {}

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          
      - name: Install Dependencies
        run: npm ci

      - name: Verify source and tests
        run: npm run verify

      - name: Generate web assets
        run: npm run assets:web

      - name: Build
        run: |
          npm run clean
          npx electron-builder --publish never
        env:
          USE_HARD_LINKS: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged DSP artifacts
        run: npm run smoke:dsp-package

      - name: Package Linux AppImage
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          appimage="EffeTune-${version}.AppImage"
          release_zip="EffeTune-${version}-Linux-AppImage.zip"

          # Keep the executable mode inside the release ZIP because the outer
          # Actions artifact ZIP does not preserve Unix file permissions.
          chmod 0755 "dist/${appimage}"
          (
            cd dist
            zip -9 "${release_zip}" "${appimage}"
            stored_mode="$(zipinfo -l "${release_zip}" "${appimage}" | awk -v file="${appimage}" '$NF == file { print $1 }')"
            test "${stored_mode}" = "-rwxr-xr-x"
          )

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: dist/*-Linux-AppImage.zip
          if-no-files-found: error
          compression-level: 0

  build-windows:
    name: Build Windows
    needs: build-linux
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Verify source and tests
        run: npm run verify

      - name: Generate web assets
        run: npm run assets:web

      - name: Build
        run: |
          npm run clean
          npx electron-builder --publish never
        env:
          USE_HARD_LINKS: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged DSP artifacts
        run: npm run smoke:dsp-package

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: dist/**/*.exe

  build-macos:
    name: Build macOS
    needs: build-windows
    runs-on: macos-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Verify source and tests
        run: npm run verify

      - name: Generate web assets
        run: npm run assets:web

      - name: Build
        run: |
          npm run clean
          npx electron-builder --publish never
        env:
          USE_HARD_LINKS: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged DSP artifacts
        run: npm run smoke:dsp-package

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-artifacts
          path: dist/**/*.dmg
