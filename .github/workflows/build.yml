name: Build Electron App

on:
  workflow_call:
    inputs:
      stage:
        description: Platform stage to build
        required: true
        type: string
      openhome_source_bundle:
        description: Include exact Linux libnl source artifacts for a desktop release
        required: false
        default: false
        type: boolean
      source_verified:
        description: Common source verification already completed by the caller
        required: false
        default: false
        type: boolean
      release_artifacts:
        description: Use desktop-release artifact names
        required: false
        default: false
        type: boolean
      store_msix:
        description: Package the signed Windows app for Microsoft Store
        required: false
        default: false
        type: boolean
    secrets:
      APPIMAGE_GPG_PRIVATE_KEY:
        description: ASCII-armored private key for Linux AppImage signatures
        required: false
      APPIMAGE_GPG_PASSPHRASE:
        description: Passphrase protecting the Linux AppImage signing key
        required: false
      APPIMAGE_GPG_KEY_FINGERPRINT:
        description: Full fingerprint of the Linux AppImage signing key
        required: false
      EVS_ACCOUNT_NAME:
        description: Castlabs EVS account name for Windows and macOS production VMP signing
        required: false
      EVS_PASSWD:
        description: Castlabs EVS account password for Windows and macOS production VMP signing
        required: false

permissions:
  contents: read

jobs:
  build-linux:
    if: inputs.stage == 'linux'
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify source and tests
        if: inputs.source_verified != true
        run: npm run verify

      - name: Install Linux OpenHome build dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [[ '${{ inputs.openhome_source_bundle }}' == 'true' ]]; then
            sources=/etc/apt/sources.list.d/ubuntu.sources
            test -f "$sources"
            sudo sed -i 's/^Types: deb$/Types: deb deb-src/' "$sources"
            grep -F 'Types: deb deb-src' "$sources"
          fi
          sudo apt-get update
          packages=(libnl-3-dev libnl-genl-3-dev gnupg)
          if [[ '${{ inputs.openhome_source_bundle }}' == 'true' ]]; then
            packages+=(dpkg-dev)
          fi
          sudo apt-get install --yes "${packages[@]}"

      - name: Generate web assets
        run: npm run assets:web

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          npm run clean
          node scripts/prepare-ecs.mjs
          npm run build:openhome-sidecar -- --no-publish-development
          if [[ '${{ inputs.openhome_source_bundle }}' == 'true' ]]; then
            npm run collect:openhome-linux-provenance -- --with-source
          else
            npm run verify:openhome-linux-provenance
          fi
          node scripts/pack-ecs.mjs --output dist
        env:
          USE_HARD_LINKS: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged DSP artifacts
        run: npm run smoke:dsp-package

      - name: Verify packaged OpenHome artifacts
        run: npm run smoke:openhome-package

      - name: Verify Linux OpenHome loader contract
        shell: bash
        run: |
          set -euo pipefail
          sidecar="dist/linux-unpacked/resources/openhome/effetune-openhome-sidecar"
          dependencies="$(readelf -d "$sidecar")"
          grep -F 'Shared library: [libnl-3.so.' <<<"$dependencies"
          grep -F 'Shared library: [libnl-genl-3.so.' <<<"$dependencies"
          grep -F 'Library runpath: [$ORIGIN]' <<<"$dependencies"
          ldd "$sidecar" | grep -F "$PWD/dist/linux-unpacked/resources/openhome/libnl-3.so."
          ldd "$sidecar" | grep -F "$PWD/dist/linux-unpacked/resources/openhome/libnl-genl-3.so."

      - name: Require complete Linux OpenHome source artifacts for release
        if: inputs.openhome_source_bundle
        run: npm run verify:openhome-linux-provenance -- --require-source

      - name: Sign and verify Linux AppImage
        shell: bash
        env:
          APPIMAGE_GPG_PRIVATE_KEY: ${{ secrets.APPIMAGE_GPG_PRIVATE_KEY }}
          APPIMAGE_GPG_PASSPHRASE: ${{ secrets.APPIMAGE_GPG_PASSPHRASE }}
          APPIMAGE_GPG_KEY_FINGERPRINT: ${{ secrets.APPIMAGE_GPG_KEY_FINGERPRINT }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REPOSITORY" != 'Frieve-A/effetune' ||
                "$GITHUB_REF_TYPE" != 'tag' || "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo 'AppImage signing requires the official repository and exact desktop version tag.' >&2
            exit 1
          fi
          : "${APPIMAGE_GPG_PRIVATE_KEY:?Configure the APPIMAGE_GPG_PRIVATE_KEY repository secret.}"
          : "${APPIMAGE_GPG_PASSPHRASE:?Configure the APPIMAGE_GPG_PASSPHRASE repository secret.}"
          : "${APPIMAGE_GPG_KEY_FINGERPRINT:?Configure the APPIMAGE_GPG_KEY_FINGERPRINT repository secret.}"
          fingerprint="${APPIMAGE_GPG_KEY_FINGERPRINT^^}"
          if [[ ! "$fingerprint" =~ ^[A-F0-9]{40}$ ]]; then
            echo 'APPIMAGE_GPG_KEY_FINGERPRINT must be the full 40-character fingerprint without spaces.' >&2
            exit 1
          fi

          export GNUPGHOME
          GNUPGHOME="$(mktemp -d "$RUNNER_TEMP/effetune-appimage-gnupg.XXXXXX")"
          cleanup() {
            gpgconf --homedir "$GNUPGHOME" --kill all || true
            rm -rf -- "$GNUPGHOME"
          }
          trap cleanup EXIT
          chmod 0700 "$GNUPGHOME"
          printf '%s\n' "$APPIMAGE_GPG_PRIVATE_KEY" | gpg --batch --import
          unset APPIMAGE_GPG_PRIVATE_KEY

          appimage="dist/EffeTune-${version}.AppImage"
          public_key="dist/EffeTune-AppImage-signing-key.asc"
          test -s "$appimage"
          gpg --batch --armor --export-options export-minimal \
            --output "$public_key" --export "$fingerprint"
          actual_fingerprint="$(gpg --batch --with-colons --show-keys "$public_key" |
            awk -F: '$1 == "fpr" { print $10; exit }')"
          test "$actual_fingerprint" = "$fingerprint"

          # Feed the passphrase through stdin, never through command arguments.
          printf '%s\n' "$APPIMAGE_GPG_PASSPHRASE" |
            gpg --batch --no-tty --pinentry-mode loopback --passphrase-fd 0 \
              --local-user "${fingerprint}!" --digest-algo SHA256 \
              --armor --detach-sign --output "${appimage}.asc" "$appimage"
          unset APPIMAGE_GPG_PASSPHRASE

          # Verify using only the public key that will be distributed.
          gpg --batch --dearmor --output "$GNUPGHOME/verification-keyring.gpg" "$public_key"
          gpgv --homedir "$GNUPGHOME" --keyring "$GNUPGHOME/verification-keyring.gpg" \
            "${appimage}.asc" "$appimage"

      - name: Package Linux AppImage
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          appimage="EffeTune-${version}.AppImage"
          release_zip="EffeTune-${version}-Linux-AppImage.zip"
          source_zip="EffeTune-${version}-OpenHome-Linux-Source.zip"

          # Keep the executable mode inside the release ZIP because the outer
          # Actions artifact ZIP does not preserve Unix file permissions.
          chmod 0755 "dist/${appimage}"
          (
            cd dist
            zip -9 "${release_zip}" "${appimage}" "${appimage}.asc" \
              EffeTune-AppImage-signing-key.asc
            stored_mode="$(zipinfo -l "${release_zip}" "${appimage}" | awk -v file="${appimage}" '$NF == file { print $1 }')"
            test "${stored_mode}" = "-rwxr-xr-x"
          )
          if [[ '${{ inputs.openhome_source_bundle }}' == 'true' ]]; then
            runtime_root="out/native/openhome-sidecar/linux-x64"
            test -f "${runtime_root}/libnl-runtime-manifest.json"
            test -d "${runtime_root}/libnl-source"
            (
              cd "$runtime_root"
              zip -9 -r "$GITHUB_WORKSPACE/dist/${source_zip}" \
                libnl-runtime-manifest.json libnl-source
            )
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.release_artifacts && 'linux-release-artifacts' || 'linux-artifacts' }}
          path: |
            dist/*-Linux-AppImage.zip
            dist/*-OpenHome-Linux-Source.zip
          if-no-files-found: error
          compression-level: 0

  build-windows:
    if: inputs.stage == 'windows'
    name: Build Windows
    runs-on: windows-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Verify source and tests
        if: inputs.source_verified != true
        run: npm run verify

      - name: Verify host-platform filesystem and Electron contracts
        if: inputs.source_verified
        run: >-
          node --test --test-concurrency=1
          tests/cjs/electron-ipc-handlers-mini-player.test.cjs
          tests/cjs/electron-ipc-handlers.test.cjs
          tests/cjs/electron-ir-library-ipc.test.cjs
          tests/cjs/electron-library-catalog-scan-runtime.test.cjs
          tests/cjs/electron-preload-clipboard.test.cjs
          tests/esm/dev-server.test.mjs

      - name: Generate web assets
        run: npm run assets:web

      - name: Prepare official ECS runtime
        run: node scripts/prepare-ecs.mjs

      - name: Run rolling PCM Electron tests
        run: npm run test:rolling-pcm:electron
        env:
          ELECTRON_OVERRIDE_DIST_PATH: ${{ github.workspace }}/out/ecs/runtime/win32-x64

      - name: Build ECS application
        run: |
          npm run clean
          if ($LASTEXITCODE -ne 0) { throw 'Clean failed.' }
          npm run build:openhome-sidecar -- --no-publish-development
          if ($LASTEXITCODE -ne 0) { throw 'OpenHome build failed.' }
          node scripts/pack-ecs.mjs --output dist
          if ($LASTEXITCODE -ne 0) { throw 'ECS packaging failed.' }
        env:
          USE_HARD_LINKS: false

      - name: Set up Python for VMP signing
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install EVS client
        run: python -m pip install --disable-pip-version-check castlabs-evs==1.3.2

      - name: Sign and verify Windows VMP
        shell: pwsh
        env:
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          EVS_CONFIG_FILE: ${{ runner.temp }}/effetune-evs.json
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            $version = node -p "require('./package.json').version"
            if ($LASTEXITCODE -ne 0) { throw 'Could not read the application version.' }
            if ($env:GITHUB_REPOSITORY -ne 'Frieve-A/effetune' -or
                $env:GITHUB_REF_TYPE -ne 'tag' -or $env:GITHUB_REF_NAME -ne "v$version") {
              throw 'VMP signing requires the official repository and exact desktop version tag.'
            }
            if (-not $env:EVS_ACCOUNT_NAME -or -not $env:EVS_PASSWD) {
              throw 'Configure the EVS_ACCOUNT_NAME and EVS_PASSWD repository secrets.'
            }
            python -m castlabs_evs.account --no-ask reauth
            if ($LASTEXITCODE -ne 0) { throw 'EVS authentication failed.' }
            python -m castlabs_evs.vmp --no-ask sign-pkg --streaming dist/win-unpacked
            if ($LASTEXITCODE -ne 0) { throw 'VMP signing failed.' }
            python -m castlabs_evs.vmp --no-ask verify-pkg --streaming dist/win-unpacked
            if ($LASTEXITCODE -ne 0) { throw 'VMP verification failed.' }
          } finally {
            if (Test-Path -LiteralPath $env:EVS_CONFIG_FILE) {
              Remove-Item -LiteralPath $env:EVS_CONFIG_FILE -Force
            }
          }

      - name: Package signed Windows installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $before = (Get-FileHash -LiteralPath dist/win-unpacked/EffeTune.exe -Algorithm SHA256).Hash
          node scripts/pack-ecs.mjs --prepackaged dist/win-unpacked --output dist
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer packaging failed.' }
          $after = (Get-FileHash -LiteralPath dist/win-unpacked/EffeTune.exe -Algorithm SHA256).Hash
          if ($before -ne $after) { throw 'Installer packaging changed the VMP-signed executable.' }
          python -m castlabs_evs.vmp --no-ask verify-pkg --streaming dist/win-unpacked
          if ($LASTEXITCODE -ne 0) { throw 'VMP verification failed after installer packaging.' }
        env:
          USE_HARD_LINKS: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify packaged DSP artifacts
        run: npm run smoke:dsp-package

      - name: Verify packaged OpenHome artifacts
        run: npm run smoke:openhome-package

      - name: Run rolling PCM distribution smoke
        run: npm run smoke:rolling-pcm-distribution

      - name: Package Microsoft Store MSIX
        if: inputs.store_msix
        run: node scripts/pack-msix-win.mjs --prepackaged dist/win-unpacked --output dist/store

      - name: Upload Microsoft Store package
        if: inputs.store_msix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-msix-x64
          path: dist/store/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Package Windows release ZIPs
        if: inputs.release_artifacts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = node -p "require('./package.json').version"
          if ($LASTEXITCODE -ne 0) { throw 'Could not read the application version.' }
          $dist = (Resolve-Path -LiteralPath dist).Path
          $portableRoot = (Resolve-Path -LiteralPath (Join-Path $dist 'win-unpacked')).Path
          $setupPath = (Resolve-Path -LiteralPath (Join-Path $dist "EffeTune-${version}-Setup.exe")).Path
          $settings = Join-Path $portableRoot 'effetune_settings'
          [void][System.IO.Directory]::CreateDirectory($settings)
          [System.IO.File]::WriteAllText((Join-Path $settings '.gitkeep'),
            "# This file ensures the directory is included in ZIP archives`r`n",
            [System.Text.UTF8Encoding]::new($false))
          [System.IO.Compression.ZipFile]::CreateFromDirectory($portableRoot,
            (Join-Path $dist "EffeTune-${version}-Windows-Portable.zip"),
            [System.IO.Compression.CompressionLevel]::Optimal, $false)
          $setupZip = [System.IO.Compression.ZipFile]::Open(
            (Join-Path $dist "EffeTune-${version}-Windows-Setup.zip"),
            [System.IO.Compression.ZipArchiveMode]::Create)
          try {
            [void][System.IO.Compression.ZipFileExtensions]::CreateEntryFromFile(
              $setupZip, $setupPath, [System.IO.Path]::GetFileName($setupPath),
              [System.IO.Compression.CompressionLevel]::Optimal)
          } finally { $setupZip.Dispose() }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.release_artifacts && 'windows-release-artifacts' || 'windows-artifacts' }}
          path: |
            dist/*-Windows-Portable.zip
            dist/*-Windows-Setup.zip
            dist/**/*.exe
            dist/win-unpacked/*.sig
            dist/latest.yml
            dist/*-Setup.exe.blockmap
          if-no-files-found: error

  build-macos:
    if: inputs.stage == 'macos'
    name: Build macOS (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify source and tests
        if: inputs.source_verified != true
        run: npm run verify

      - name: Verify host-platform filesystem and Electron contracts
        if: inputs.source_verified
        run: >-
          node --test --test-concurrency=1
          tests/cjs/electron-alac-playback-source.test.cjs
          tests/cjs/electron-ipc-handlers-mini-player.test.cjs
          tests/cjs/electron-ipc-handlers.test.cjs
          tests/cjs/electron-ir-library-ipc.test.cjs
          tests/cjs/electron-library-catalog-scan-runtime.test.cjs
          tests/cjs/electron-preload-clipboard.test.cjs
          tests/esm/dev-server.test.mjs

      - name: Generate web assets
        run: npm run assets:web

      - name: Prepare official ECS runtime
        run: node scripts/prepare-ecs.mjs

      - name: Build OpenHome sidecar
        shell: bash
        run: |
          set -euo pipefail
          npm run clean
          npm run build:openhome-sidecar -- --arch ${{ matrix.arch }} --no-publish-development

      - name: Set up Python for VMP signing
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install EVS client
        run: python -m pip install --disable-pip-version-check castlabs-evs==1.3.2

      - name: Build and verify macOS VMP application
        shell: bash
        env:
          USE_HARD_LINKS: false
          EVS_ACCOUNT_NAME: ${{ secrets.EVS_ACCOUNT_NAME }}
          EVS_PASSWD: ${{ secrets.EVS_PASSWD }}
          EVS_CONFIG_FILE: ${{ runner.temp }}/effetune-evs.json
        run: |
          set -euo pipefail
          trap 'rm -f -- "$EVS_CONFIG_FILE"' EXIT
          version="$(node -p "require('./package.json').version")"
          if [[ "$GITHUB_REPOSITORY" != 'Frieve-A/effetune' ||
                "$GITHUB_REF_TYPE" != 'tag' || "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo 'VMP signing requires the official repository and exact desktop version tag.' >&2
            exit 1
          fi
          : "${EVS_ACCOUNT_NAME:?Configure the EVS_ACCOUNT_NAME repository secret.}"
          : "${EVS_PASSWD:?Configure the EVS_PASSWD repository secret.}"
          python -m castlabs_evs.account --no-ask reauth
          node scripts/pack-ecs.mjs --sign-vmp --output dist

      - name: Package verified macOS DMG
        shell: bash
        env:
          USE_HARD_LINKS: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          app_dir=dist/mac
          if [[ '${{ matrix.arch }}' == 'arm64' ]]; then
            app_dir=dist/mac-arm64
          fi
          node scripts/pack-ecs.mjs --prepackaged "$app_dir/EffeTune.app" --output dist
          python -m castlabs_evs.vmp --no-ask verify-pkg --streaming "$app_dir"

      - name: Verify packaged DSP artifacts
        run: npm run smoke:dsp-package

      - name: Verify packaged OpenHome artifacts
        run: npm run smoke:openhome-package

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.release_artifacts && format('macos-{0}-release-artifacts', matrix.arch) || format('macos-{0}-artifacts', matrix.arch) }}
          path: dist/**/*.dmg
          if-no-files-found: error
