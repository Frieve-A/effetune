title: "Frieve EffeTune"
description: "Color the music, unleash your senses. Build precise effect chains for streaming, local files, physical sources, measurement, and multichannel playback."
url: "https://effetune.frieve.com"
baseurl: ""
lang: en

# Author/Organization info for SEO
author:
  name: "Frieve"
  url: "https://www.frieve.com"

# Social/SEO settings
twitter:
  username: frievea
  card: summary_large_image

social:
  name: "Frieve EffeTune"
  links:
    - https://github.com/Frieve-A/effetune
    - https://www.youtube.com/@frieveamusic
    - https://discord.gg/gf95v3Gza2

# Open Graph defaults
logo: /images/icon_512x512.png
image: /images/ogp.jpg

# Markdown and build settings
markdown: kramdown
highlighter: rouge

kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: true

exclude:
  - .agents/
  - .codex/
  - .cursor/
  - .github/
  - .jekyll-cache/
  - .npm-cache/
  - .qodo/
  - .tmp/
  - .VSCodeCounter/
  - .worktrees/
  - _site/
  - AGENTS.md
  - build/
  - code_review.md
  - dist/
  - dsp/
  - electron/
  - experiments/
  - extension/
  - eslint.config.mjs
  - mcp/
  - native/
  - node_modules/
  - out/
  - package-lock.json
  - scripts/
  - tests/
  - tmp/
  - tools/

# Favicon configuration
favicon_ico: "/images/favicon.ico"

# Default front matter
defaults:
  # Root index.md includes README.md -> index.html
  - scope:
      path: "index.md"
    values:
      layout: "home"
      title: "Frieve EffeTune - Real-time Audio Effect Processor"
      description: "Free real-time audio effects for music listening: EQ, tube amp, AM radio, visualizer, and 100+ more. Web/PWA, desktop, Chrome/Edge extension, VST3."
      image: /images/ogp.jpg
      permalink: /
  # Japanese overview
  - scope:
      path: "docs/i18n/ja/index.md"
    values:
      layout: "default"
      title: "Frieve EffeTune - リアルタイムオーディオエフェクトプロセッサ"
      description: "音楽鑑賞のための無料リアルタイムオーディオエフェクト。EQ、真空管アンプ、AMラジオ、Visualizerなど100種類以上を搭載。Web/PWA、デスクトップアプリ、Chrome/Edge拡張版、VST3版で利用できます。"
      lang: "ja"
      image: /images/ogp.jpg
      permalink: /docs/i18n/ja/
  # Korean overview
  - scope:
      path: "docs/i18n/ko/index.md"
    values:
      layout: "default"
      title: "Frieve EffeTune - 실시간 오디오 이펙트 프로세서"
      description: "음악 감상을 위한 무료 실시간 오디오 이펙트. EQ, 진공관 앰프, AM 라디오, Visualizer 등 100개 이상 제공. Web/PWA, 데스크톱 앱, Chrome/Edge 확장 프로그램, VST3 버전 지원."
      lang: "ko"
      image: /images/ogp.jpg
      permalink: /docs/i18n/ko/
