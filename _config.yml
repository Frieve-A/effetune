      description: "Более 100 бесплатных аудиоэффектов в реальном времени для прослушивания музыки: EQ, ламповый усилитель, AM-радио, Visualizer и многое другое. Версии: Web/PWA, настольное приложение, расширение для Chrome/Edge и VST3."
