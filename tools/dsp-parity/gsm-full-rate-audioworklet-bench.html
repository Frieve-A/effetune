<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>GSM Full Rate AudioWorklet benchmark</title>
</head>
<body>
  <script type="module">
    const PLUGIN_TYPE = 'GSMFullRateSimulatorPlugin';
    const PARAMS_HASH = 0xb9a2741c;
    const PARAMETERS = Object.freeze({ tc: 3, og: 0, mx: 100, ci: 30 });
    const SUPPORTED_SAMPLE_RATES = Object.freeze([
      44100, 48000, 88200, 96000, 176400, 192000, 352800, 384000
    ]);
    let resource = null;

    function packParameters(params = {}) {
      const transcodes = typeof params.tc === 'number' && Number.isFinite(params.tc)
        ? Math.min(3, Math.max(1, Math.round(params.tc)))
        : 1;
      const outputGain = typeof params.og === 'number' && Number.isFinite(params.og)
        ? Math.min(12, Math.max(-24, params.og))
        : 0;
      const mix = Number.isSafeInteger(params.mx)
        ? Math.min(100, Math.max(0, params.mx))
        : 100;
      const carrierToInterference =
        typeof params.ci === 'number' && Number.isFinite(params.ci)
          ? Math.min(30, Math.max(4, params.ci))
          : 30;
      return Float32Array.of(
        transcodes,
        outputGain,
        mix,
        carrierToInterference
      );
    }

    function createMessageObserver(port) {
      const messages = [];
      const waiters = new Set();
      port.onmessage = event => {
        const message = event.data;
        messages.push(message);
        for (const waiter of [...waiters]) {
          if (!waiter.predicate(message)) continue;
          waiters.delete(waiter);
          clearTimeout(waiter.timeout);
          waiter.resolve(message);
        }
      };
      return {
        waitFor(predicate, timeoutMs = 15_000) {
          const existing = messages.find(predicate);
          if (existing) return Promise.resolve(existing);
          return new Promise((resolve, reject) => {
            const waiter = { predicate, resolve, reject, timeout: null };
            waiter.timeout = setTimeout(() => {
              waiters.delete(waiter);
              reject(new Error('Timed out waiting for an AudioWorklet message.'));
            }, timeoutMs);
            waiters.add(waiter);
          });
        },
        dispose() {
          for (const waiter of waiters) {
            clearTimeout(waiter.timeout);
            waiter.reject(new Error('AudioWorklet message observer disposed.'));
          }
          waiters.clear();
          port.onmessage = null;
        }
      };
    }

    function createNoiseSource(context) {
      const buffer = new AudioBuffer({
        numberOfChannels: 2,
        length: context.sampleRate,
        sampleRate: context.sampleRate
      });
      let state = 0x4d534d46;
      for (let channel = 0; channel < 2; channel++) {
        const samples = buffer.getChannelData(channel);
        for (let index = 0; index < samples.length; index++) {
          state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
          samples[index] = ((state / 0x80000000) - 1) * 0.2;
        }
      }
      const source = new AudioBufferSourceNode(context, { buffer, loop: true });
      return source;
    }

    async function initialize({ sampleRate, artifactUrl, metadataUrl, simd }) {
      if (resource) throw new Error('GSM Full Rate benchmark is already initialized.');
      const context = new AudioContext({ sampleRate, latencyHint: 'interactive' });
      let node;
      let source;
      let outputGain;
      let observer;
      try {
        if (context.sampleRate !== sampleRate) {
          throw new Error(`Requested ${sampleRate} Hz, received ${context.sampleRate} Hz.`);
        }
        const metadataResponse = await fetch(metadataUrl, { cache: 'no-store' });
        if (!metadataResponse.ok) {
          throw new Error(`Unable to load DSP metadata: HTTP ${metadataResponse.status}.`);
        }
        await metadataResponse.arrayBuffer();
        const processorResponse = await fetch('/plugins/audio-processor.js', { cache: 'no-store' });
        if (!processorResponse.ok) {
          throw new Error(`Unable to load the audio processor: HTTP ${processorResponse.status}.`);
        }
        const processorUrl = URL.createObjectURL(new Blob([
          await processorResponse.arrayBuffer()
        ], { type: 'text/javascript' }));
        try {
          await context.audioWorklet.addModule(processorUrl);
        } finally {
          URL.revokeObjectURL(processorUrl);
        }
        node = new AudioWorkletNode(context, 'plugin-processor', {
          numberOfInputs: 1,
          numberOfOutputs: 1,
          outputChannelCount: [2],
          channelCount: 2,
          channelCountMode: 'explicit',
          processorOptions: {
            initialOutputChannelCount: 2,
            lowLatencyMode: true
          }
        });
        observer = createMessageObserver(node.port);
        source = createNoiseSource(context);
        outputGain = new GainNode(context, { gain: 0 });
        source.connect(node).connect(outputGain).connect(context.destination);
        source.start();
        await context.resume();
        if (context.state !== 'running') throw new Error('AudioContext did not start.');

        const artifactResponse = await fetch(artifactUrl);
        if (!artifactResponse.ok) {
          throw new Error(`Unable to load DSP artifact: HTTP ${artifactResponse.status}.`);
        }
        const bytes = await artifactResponse.arrayBuffer();
        const plugin = {
          id: 1,
          type: PLUGIN_TYPE,
          enabled: true,
          inputBus: 0,
          outputBus: 0,
          channel: null,
          parameters: { ...PARAMETERS, enabled: true },
          wasmParams: packParameters(PARAMETERS),
          wasmParamsHash: PARAMS_HASH,
          executionCapabilities: {
            requiresWasm: true,
            supportedSampleRates: SUPPORTED_SAMPLE_RATES,
            supportedChannelModes: ['mono', 'stereo-pair']
          }
        };
        node.port.postMessage({
          type: 'registerProcessor',
          pluginType: plugin.type,
          processor: 'return data;'
        });
        node.port.postMessage({
          type: 'updateAudioConfig',
          outputChannels: 2,
          lowLatencyMode: true,
          sampleRate
        });
        node.port.postMessage({ type: 'updatePlugins', plugins: [plugin], masterBypass: false });
        node.port.postMessage({ type: 'dspEnableTypes', types: [plugin.type] });
        node.port.postMessage({ type: 'dspModule', bytes, simd }, [bytes]);

        const ready = await observer.waitFor(message =>
          message?.type === 'dspReady' || message?.type === 'dspFailed'
        );
        if (ready.type === 'dspFailed') {
          throw new Error(`DSP initialization failed at ${ready.stage}: ${ready.error}`);
        }
        if (ready.simd !== simd) throw new Error('AudioWorklet loaded the wrong DSP variant.');
        await observer.waitFor(message =>
          message?.type === 'dspExecutionState' &&
          message.pluginId === plugin.id &&
          message.state === 'active'
        );
        const warmupStarted = context.currentTime;
        await new Promise(resolve => setTimeout(resolve, 1_000));
        await context.suspend();
        resource = { context, node, source, outputGain, observer };
        return {
          requestedSampleRate: sampleRate,
          actualSampleRate: context.sampleRate,
          state: context.state,
          simd: ready.simd,
          pluginType: PLUGIN_TYPE,
          parameters: PARAMETERS,
          channels: 2,
          blockSize: 128,
          stimulus: 'noise',
          warmupContextSeconds: context.currentTime - warmupStarted,
          baseLatency: context.baseLatency
        };
      } catch (error) {
        observer?.dispose();
        try { source?.stop(); } catch {}
        source?.disconnect();
        node?.disconnect();
        outputGain?.disconnect();
        await context.close().catch(() => {});
        throw error;
      }
    }

    async function startPreRoll(durationMs) {
      if (!resource || resource.context.state !== 'suspended') {
        throw new Error('GSM Full Rate benchmark is not ready for trace pre-roll.');
      }
      await resource.context.resume();
      if (resource.context.state !== 'running') throw new Error('AudioContext did not resume.');
      const startTime = resource.context.currentTime;
      await new Promise(resolve => setTimeout(resolve, durationMs));
      const endTime = resource.context.currentTime;
      return {
        state: resource.context.state,
        startTime,
        endTime,
        contextSeconds: endTime - startTime
      };
    }

    async function measure(durationMs) {
      if (!resource || resource.context.state !== 'running') {
        throw new Error('GSM Full Rate benchmark pre-roll is not running.');
      }
      const startTime = resource.context.currentTime;
      await new Promise(resolve => setTimeout(resolve, durationMs));
      await resource.context.suspend();
      const endTime = resource.context.currentTime;
      return {
        startTime,
        endTime,
        contextSeconds: endTime - startTime,
        state: resource.context.state
      };
    }

    async function close() {
      if (!resource) return;
      const current = resource;
      resource = null;
      current.observer.dispose();
      try { current.source.stop(); } catch {}
      current.source.disconnect();
      current.node.disconnect();
      current.outputGain.disconnect();
      await current.context.close();
    }

    window.gsmFullRateAudioWorkletBench = { initialize, startPreRoll, measure, close };
  </script>
</body>
</html>
