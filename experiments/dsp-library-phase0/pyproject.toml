[build-system]
requires = [
  "nanobind>=2.9,<3",
  "scikit-build-core>=1.0,<2"
]
build-backend = "scikit_build_core.build"

[project]
name = "effetune-phase0-poc"
version = "0.0.0"
description = "Private Phase 0 proof of concept for the EffeTune DSP library"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26"]

[tool.scikit-build]
build-dir = "../../out/dsp-library-phase0/build/{wheel_tag}"
wheel.packages = ["python/effetune_phase0"]
